name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans every commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pre-publish check (private words, IPs, emails, phones, AWS ids)
        env:
          BLOCKED_WORDS: ${{ secrets.BLOCKED_WORDS }}
        run: python scripts/prepublish_check.py
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements-dev.txt

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .github "./**/*.md"
          fail: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: acme
          POSTGRES_USER: acme_admin
          POSTGRES_PASSWORD: postgres # throwaway CI database
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acme_admin -d acme"
          --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 20
    env:
      INTEGRATION: "1"
      ADMIN_DATABASE_URL: postgresql://acme_admin:postgres@localhost:5432/acme
      APP_DB_PASSWORD: gateway-app-ci-only
      DATABASE_URL: postgresql://gateway_app:gateway-app-ci-only@localhost:5432/acme
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrate and seed
        run: python -m app.migrate --seed
      - name: Tests (unit + API + integration), coverage gate 80%
        run: pytest --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Image runs as a non-root user
        run: |
          docker build -t secure-read-gateway:ci .
          test "$(docker run --rm --entrypoint id secure-read-gateway:ci -u)" = "10001"
      - name: Full stack smoke test (docker compose + example agent)
        run: |
          python scripts/make_env.py
          docker compose up -d --build --wait api
          pip install httpx==0.28.1
          python examples/ask.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: docker compose down -v
