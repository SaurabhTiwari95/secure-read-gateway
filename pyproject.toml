[project]
name = "secure-read-gateway"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov=client --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"] # FastAPI's Depends() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/migrate.py" = ["S311", "S608"] # sample data needs no crypto RNG; SQL names are constants
